<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <radialGradient id="disc" cx="38%" cy="27%" r="82%"><stop offset="0" stop-color="#283a70"/><stop offset=".46" stop-color="#111a3a"/><stop offset="1" stop-color="#070b19"/></radialGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ffff"/><stop offset=".19" stop-color="#7feaff"/><stop offset=".38" stop-color="#3a7fbb"/><stop offset=".55" stop-color="#e3faff"/><stop offset=".72" stop-color="#8175d8"/><stop offset="1" stop-color="#d9fcff"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ffff"/><stop offset=".25" stop-color="#688ddd"/><stop offset=".55" stop-color="#b9a6ff"/><stop offset=".78" stop-color="#2fd3e9"/><stop offset="1" stop-color="#efffff"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4ffff"/><stop offset="1" stop-color="#78d9ef"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#00050e" flood-opacity=".85"/></filter>
</defs>
<!-- Nothing is drawn outside the medallion, so the background remains transparent. -->
<g filter="url(#shadow)">
  <circle cx="256" cy="256" r="222" fill="#07101c" stroke="#07101c" stroke-width="16"/>
  <circle cx="256" cy="256" r="218" fill="url(#disc)" stroke="url(#edge)" stroke-width="12"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#5c81c2" stroke-width="3" opacity=".95"/>
  <circle cx="256" cy="256" r="181" fill="none" stroke="#a9f7ff" stroke-width="1.8" opacity=".75"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#5b66b6" stroke-width="2" stroke-dasharray="3 11" opacity=".9"/>
  <!-- four crystalline compass points -->
  <path d="M256 8 286 54 256 75 226 54Z" fill="url(#edge)" stroke="#e9ffff" stroke-width="3"/>
  <path d="M256 504 286 458 256 437 226 458Z" fill="url(#edge)" stroke="#e9ffff" stroke-width="3"/>
  <path d="M8 256 54 226 75 256 54 286Z" fill="url(#edge)" stroke="#e9ffff" stroke-width="3"/>
  <path d="M504 256 458 226 437 256 458 286Z" fill="url(#edge)" stroke="#e9ffff" stroke-width="3"/>
  <!-- tiny cut-gem highlights -->
  <path d="M256 23 271 54 256 66 241 54Z" fill="#ffffff" opacity=".82"/>
  <path d="M256 489 271 458 256 446 241 458Z" fill="#ffffff" opacity=".78"/>
  <!-- open-book motif -->
  <g transform="translate(0 23)" opacity=".95">
    <path d="M158 327 Q206 307 252 333 L252 367 Q206 341 158 358Z" fill="url(#page)" stroke="#e8fdff" stroke-width="3"/>
    <path d="M354 327 Q306 307 260 333 L260 367 Q306 341 354 358Z" fill="url(#page)" stroke="#e8fdff" stroke-width="3"/>
    <path d="M256 331V370" stroke="#141e4a" stroke-width="5"/>
    <path d="M174 337 Q210 327 237 344 M174 348 Q210 338 237 355 M338 337 Q302 327 275 344 M338 348 Q302 338 275 355" fill="none" stroke="#3961a5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- original HP monogram -->
  <g filter="url(#glow)">
    <text x="256" y="277" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="156" letter-spacing="-13" fill="url(#silver)" stroke="#253b70" stroke-width="2.5" paint-order="stroke fill">HP</text>
  </g>
  <path d="M156 296 Q206 319 244 302 M356 296 Q306 319 268 302" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <circle cx="256" cy="93" r="6" fill="#f4ffff"/><circle cx="256" cy="419" r="6" fill="#f4ffff"/>
  <circle cx="93" cy="256" r="4" fill="#a4f5ff"/><circle cx="419" cy="256" r="4" fill="#a4f5ff"/>
</g>
</svg>